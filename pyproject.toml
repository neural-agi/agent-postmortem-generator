[project]
name = "agent-postmortem-generator"
version = "0.1.0"
description = "Generate deterministic, evidence-based postmortem reports from failed AI agent execution traces."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
    { name = "Paranjay Das" }
]

keywords = [
    "ai",
    "agents",
    "postmortem",
    "debugging",
    "langgraph",
    "crewai",
    "autogen",
    "openai",
    "observability",
    "developer-tools"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Operating System :: OS Independent"
]

dependencies = [
    "networkx>=3.6.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.26.8",
]

[project.urls]
Homepage = "https://github.com/<YOUR_USERNAME>/agent-postmortem-generator"
Repository = "https://github.com/<YOUR_USERNAME>/agent-postmortem-generator"
Issues = "https://github.com/<YOUR_USERNAME>/agent-postmortem-generator/issues"

[project.scripts]
apg = "agent_postmortem.cli:app"



[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



[tool.ruff]
line-length = 100
target-version = "py313"

exclude = [
    ".git",
    ".venv",
    "build",
    "dist"
]



[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "N",
    "RUF"
]

ignore = [
    "E501"
]



[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"



[tool.mypy]
python_version = "3.13"

strict = true

warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

pretty = true
show_error_codes = true

exclude = [
    "^tests/"
]



[tool.pytest.ini_options]
testpaths = [
    "tests"
]

pythonpath = [
    "src"
]

addopts = [
    "--strict-markers",
    "--cov=src/agent_postmortem",
    "--cov-report=term-missing"
]



[tool.coverage.run]
source = [
    "src/agent_postmortem"
]

branch = true



[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
[tool.hatch.build.targets.wheel]
packages = ["src/agent_postmortem"]
